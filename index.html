<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Caveat:wght@600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>html:not(.css-ready) body { visibility: hidden; background: #000; }</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo"></span><span class="name">Creative Generator</span></div>
  <div id="navSlot"></div>
  <div class="spacer"></div>
  <button class="btn export-btn" id="exportNav" type="button"><span id="exportNavIc"></span><span>Export</span></button>
</header>

<main>
  <!-- Seite 1: Format -->
  <section class="page" id="page-format">
    <div class="format-wrap">
      <div class="format-main">
        <div class="pill aspect" id="aspectBar"></div>
        <div class="chips" id="moreChips" hidden></div>

        <div class="pill dims">
          <label class="dim"><span>B</span><input id="inW" type="number" min="16" max="16384" step="1"></label>
          <button class="act" id="lockBtn" type="button"></button>
          <label class="dim"><span>H</span><input id="inH" type="number" min="16" max="16384" step="1"></label>
          <span class="unit">px</span>
          <button class="act" id="swapBtn" type="button" title="Drehen"></button>
        </div>

        <dl class="info" id="fmtInfo"></dl>
        <button class="btn primary" id="toSandbox" type="button"><span>Weiter</span></button>
      </div>
      <div class="format-side"><div id="fmtShape"></div></div>
      <div class="library" id="library"></div>
    </div>
  </section>

  <!-- Seite 3: KI-Generator (lokal über Ollama) -->
  <section class="page" id="page-ai">
    <div class="ai-wrap" id="aiRoot"></div>
  </section>

  <!-- Seite 2: Sandbox -->
  <section class="page" id="page-sandbox">
    <aside class="panel">
      <div class="panel-head" id="panelHead"></div>
      <div id="groups"></div>
    </aside>

    <div class="stage">
      <div class="viewport" id="viewport">
        <canvas id="cv"></canvas>
        <div class="rec" id="recOverlay">
          <span class="rec-dot"></span><span id="recTime"></span>
          <span class="rec-bar"><i id="recBar"></i></span>
          <button class="act" id="recCancel" type="button" title="Abbrechen"></button>
        </div>
      </div>
      <div class="transport">
        <div class="pill transport-pill">
          <button class="play" id="playBtn" type="button"></button>
          <input type="range" class="vs scrub" id="scrub" min="0" max="1" step="0.0005" value="0" aria-label="Position im Loop">
          <span class="time" id="timeLbl"></span>
        </div>
        <div id="qualSlot"></div>
        <button class="btn quick" id="quickExp" type="button" title="Exportieren"><span id="quickIc"></span><span id="quickLbl">PNG</span></button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<!-- Lädt CSS und Skripte immer im aktuellen Stand: Jede Datei wird kurz beim Server nachgefragt
     (unverändert = 304), danach eingebunden. Sonst nutzt der Browser nach einem Update
     bis zu 10 Minuten die alte Fassung (GitHub Pages: max-age=600). Reihenfolge bleibt erhalten. -->
<script>
(async () => {
  const css = ["css/base.css", "css/controls.css", "css/format.css", "css/sandbox.css", "css/ai.css"];
  const js = [
    "js/core/utils.js",
    "js/core/haptics.js",
    "js/core/icons.js",
    "js/core/renderer.js",
    "js/core/mp4.js",
    "js/core/assets.js",
    "js/core/strokes.js",
    "js/gl/common.js",
    "js/functions/shared.js",
    "js/functions/fire.js",
    "js/functions/grounddata.js",
    "js/functions/fragment.js",
    "js/functions/pencil.js",
    "js/ai/settings.js",
    "js/ai/client.js",
    "js/ai/parse.js",
    "js/ai/schema.js",
    "js/ai/prompt.js",
    "js/ai/sandbox.js",
    "js/ai/validate.js",
    "js/ai/store.js",
    "js/ai/layers.js",
    "js/ai/registry.js",
    "js/ai/pipeline.js",
    "js/ui/controls.js",
    "js/ui/format-page.js",
    "js/ui/panel.js",
    "js/ui/exporter.js",
    "js/ui/library.js",
    "js/ui/layer.js",
    "js/ui/sketch.js",
    "js/ui/vptools.js",
    "js/ui/ai-page.js",
    "js/app.js",
  ];
  if (location.protocol !== 'file:') await Promise.all([...css, ...js].map(u => fetch(u, { cache: 'no-cache' }).catch(() => null)));
  await Promise.all(css.map(href => new Promise(res => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; l.onload = l.onerror = res; document.head.appendChild(l);
  })));
  document.documentElement.classList.add('css-ready');
  for (const src of js) {
    const sc = document.createElement('script'); sc.src = src; sc.async = false; document.body.appendChild(sc);
  }
})();
</script>
</body>
</html>
